# Publica no GitHub Pages a cada push na master:
#   /                 IoT Signal Lab 3D (pasta lab-3d)
#   /smart-lighting/  Smart Lighting Lab 3D (pasta smart-lighting)
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lab-3d/package-lock.json
            smart-lighting/package-lock.json

      - name: IoT Signal Lab 3D
        working-directory: lab-3d
        run: npm ci && npm test && npm run build

      - name: Smart Lighting Lab 3D
        working-directory: smart-lighting
        run: npm ci && npm test && npm run build

      # Os dois builds usam caminhos relativos (base './'), então funcionam em subpasta.
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r lab-3d/dist/. _site/
          mkdir -p _site/smart-lighting
          cp -r smart-lighting/dist/. _site/smart-lighting/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
